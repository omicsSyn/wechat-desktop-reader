name: Synthetic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install libzstd on macOS
        if: runner.os == 'macOS'
        run: brew list zstd >/dev/null 2>&1 || brew install zstd
      - name: Record native runtime
        run: python -c "import platform; print(platform.system(), platform.release(), platform.machine(), platform.python_version())"
      - name: Compile Python sources without writing bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('scripts').glob('*.py'):
              compile(path.read_bytes(), str(path), 'exec')
          PY
      - name: Run synthetic tests only
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
